name: CI Pipeline Ahorcado

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  integracion-continua:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar compilación (Build)
        # tsc es la compilación. No cuenta como análisis estático.
        run: npx tsc

      - name: Build de producción
        run: npm run build

      - name: Ejecutar Unit Tests y Coverage (90%)
        run: npx vitest run --coverage

      # Los dos pasos de publicación corren también cuando la coverage baja
      # del umbral, para que el reporte del run fallido quede visible.
      - name: Publicar resumen de coverage
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const fila = (nombre, k) => `| ${nombre} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log([
              "## Coverage del dominio (src/domain, umbral 90%)",
              "",
              "| Métrica | % | Cubierto |",
              "| --- | --- | --- |",
              fila("Líneas", "lines"),
              fila("Sentencias", "statements"),
              fila("Funciones", "functions"),
              fila("Ramas", "branches"),
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reporte de coverage
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar Acceptance Tests
        run: npm run at

  analisis-estatico:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      # Quality gate: --error-on-warnings hace que cualquier hallazgo termine
      # con exit 1, el job falla y el deploy (needs:) no corre.
      - name: Quality gate con Biome (linter)
        run: npm run lint

      # CodeQL publica hallazgos de seguridad en GitHub, pero no corta el job:
      # el corte lo da el paso anterior.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v3

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integracion-continua, analisis-estatico]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
