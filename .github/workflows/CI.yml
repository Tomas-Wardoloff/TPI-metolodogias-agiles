name: CI Pipeline Ahorcado

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integracion-continua:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Validar compilación (Build)
        # Usamos npx tsc porque en tu package.json no hay un script "build"
        run: npx tsc

      - name: Ejecutar Unit Tests y Coverage (90%)
        run: npx vitest run --coverage

      - name: Instalar navegadores de Playwright
        # Playwright necesita descargar Chromium para correr las pruebas en la nube
        run: npx playwright install --with-deps

      - name: Ejecutar Acceptance Tests
        run: npm run at